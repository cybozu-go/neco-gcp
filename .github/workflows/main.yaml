name: main
on:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # Cloud Functions only supports a limited set of Go runtime versions.
      # This set may not contain the Go version we use in our development environment.
      # Therefore, we should run tests with both the Cloud Functions Go runtime version and our development environment Go version.
      # See `--runtime` options for `gcloud functions deploy` in `Makefile.*` to find the Cloud Functions runtime Go version we use.
      matrix:
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: "${{ vars.TAKUMI_GUARD_BOT_ID }}"
      - run: make check-generated
      - run: make lint
      - run: make test
      - run: make build
