name: Clean up SSH Keys
on:
  workflow_dispatch:
  schedule:
    # Avoid the schedule of update-vmxenabled-image, which uses SSH keys in the project metadata.
    - cron:  '0 21 * * *'
permissions: {}
jobs:
  daily:
    permissions:
      id-token: write # Workload Identity Federation
    runs-on: ubuntu-26.04
    steps:
      # Required roles for the service account in the neco-test project:
      # - roles/compute.instanceAdmin.v1: remove SSH keys from the project metadata
      #   (compute.projects.get and compute.projects.setCommonInstanceMetadata)
      - name: Authenticate to Google Cloud for neco-test
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.NECO_TEST_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: neco-gcp-actions@neco-test.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up SSH keys in neco-test project
        run: gcloud --quiet --project neco-test compute project-info remove-metadata --keys=ssh-keys
